<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
</head>
<body>
<h1>Customer Form</h1>
<!--/*@thymesVar id="customersForm" type=""*/-->
<form th:action="@{/customer-List}" th:object="${customerForm}" method="post">
    <label for="name"> Name</label>
    <input type="text" id="name" th:field="*{name}"/> <br/>
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>


    <label for="email" > Email </label>
    <input type="email" id="email" th:field="*{email}"/> <br>
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label for="phone"> Phone</label>
    <input type="number" id="phone" th:field="*{phone}"/> <br/>
    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

    <button type="submit">Submit</button>
</form>
</body>
</html>
