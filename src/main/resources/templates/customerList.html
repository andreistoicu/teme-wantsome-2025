<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
</head>
<body>
<h1>Customer List</h1>
<ul>

    <li th:each="customer : ${customers}">
        <span th:text="${customer.id}"></span>
        <span th:text="${customer.name}"></span> -
        <span th:text="${customer.email}"></span> -
        <span th:text="${customer.phone}"></span>
    </li>


</ul>
</body>
</html>
