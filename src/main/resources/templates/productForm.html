<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="UTF-8">
  <title>Formular de Produse</title>
</head>
<body>
<h1>Product Form</h1>
<form th:action="@{/submitProduct}" th:object="${product}" method="post">
  <label for="name"> Name</label>


  <input type="text" id="name" th:field="*{name}"/> <br/>
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
  <br>


  <label for="price">Price</label>
  <input type="text" id="price" th:field="*{price}"/> <br/>
  <br>

  <label for="available">Available</label>
  <input type="checkbox" id="available" th:field="*{available}">Produs in stoc</input>
  <br>

  <div>
  <button type="submit">Inregistrare Produs</button>
  </div>

</form>
</body>
</html>
