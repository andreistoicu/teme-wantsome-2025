<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Employees</title>
</head>
<body>
<h1>List Employees</h1>
<ul>

    <li th:each="employee : ${employees}">
        <span th:text="${employee.id}"></span>.
        <span th:text="${employee.name}"></span> -
        <span th:text="${employee.department}"></span> -
        <span th:text="${employee.email}"></span> -
        <span th:text="${employee.salary}"></span>
    </li>


</ul>
</body>
</html>
