<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formular de Inscriere</title>
</head>
<body>
<h1>Users Form</h1>
<form th:action="@{/submitUser}" th:object="${user}" method="post">
  <label for="name"> Name</label>
  <input type="text" id="name" th:field="*{name}"/> <br/>
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
<br>

  <label for="email"> Email</label>
  <input type="text" id="email" th:field="*{email}"/> <br/>
<br>

  <button type="submit">Inregistrare</button>

</form>
</body>
</html>
