<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Course Form</title>
</head>
<body>
<h1>Course Form</h1>
<form th:action="@{/submitCourse}" th:object="${course}" method="post">

  <div>
    <label for="name"> Name</label>
    <input type="text" id="name" th:field="*{name}"/> <br/>
  </div>
<br>
  <div>
    <button type="submit">Save</button>
  </div>
<br>
  <div>
    <a th:href="@{/products}">Go to courses list</a>
  </div>

</form>
</body>
</html>
