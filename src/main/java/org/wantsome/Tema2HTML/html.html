<html>
<head>
</head>
<body>
<form method="post" action="/submit">
    <label for="firstname">First Name:</label>
    <input type="text" id="firstname" name="firstname" required><br><br>

    <label for="lastname" >Last Name:</label>
    <input type="text" id="lastname" name="lastname" required><br><br>

    <label for="email" >Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password" >Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <label for="dateofbirth" >Date of Birth:</label>
    <input type="date" id="dateofbirth" name="dateofbirth" required><br><br>

    <p>Subscription Plan:</p>
    <input type="radio" id="basic" name="plan" value="basic">
    <label for="basic">Basic</label><br>

    <input type="radio" id="standart" name="plan" value="standart">
    <label for="standart">Standart</label><br>

    <input type="radio" id="premium" name="plan" value="premium">
    <label for="premium">Premium</label><br>

    <p>Interests:</p>
    <input type="checkbox" id="technology" name="interests" value="technology">
    <label for="technology">Technology</label><br>

    <input type="checkbox" id="sports" name="interests" value="sports">
    <label for="sports">Sports</label><br>

    <input type="checkbox" id="arts" name="interests" value="arts">
    <label for="arts">Arts</label><br>

    <button type="submit">Register</button>

</form>
</body>
</html>
